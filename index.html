<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK MOSARAF | Portfolio</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">SK MOSARAF</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="#home">Home</a>
        <a class="nav-link" href="#skills">Skills</a>
        <a class="nav-link" href="#contact">Contact</a>
      </div>
    </div>
  </nav>

  <section id="home" class="hero text-center">
    <div class="container">
      <h1>Hello, I'm SK MOSARAF</h1>
      <h3>B.Tech CSE | AI & ML</h3>
      <p>Welcome to my personal portfolio website.</p>
      <a href="#skills" class="btn btn-primary">Explore My Skills</a>
    </div>
  </section>

  <section id="skills" class="container py-5">
    <h2 class="text-center mb-4">My Skills</h2>
    <div class="row g-3">
      <div class="col-md-4"><div class="card skill-card"><div class="card-body">HTML</div></div></div>
      <div class="col-md-4"><div class="card skill-card"><div class="card-body">CSS</div></div></div>
      <div class="col-md-4"><div class="card skill-card"><div class="card-body">JavaScript</div></div></div>
      <div class="col-md-4"><div class="card skill-card"><div class="card-body">Bootstrap</div></div></div>
      <div class="col-md-4"><div class="card skill-card"><div class="card-body">Java</div></div></div>
      <div class="col-md-4"><div class="card skill-card"><div class="card-body">React</div></div></div>
    </div>
  </section>

  <section id="contact" class="container py-5">
    <h2 class="text-center mb-4">Contact Me</h2>

    <form id="contactForm" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control">
        <small id="nameError" class="error"></small>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="text" id="email" class="form-control">
        <small id="emailError" class="error"></small>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" class="form-control" rows="4"></textarea>
        <small id="messageError" class="error"></small>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
      <p id="successMessage" class="text-success mt-3"></p>
    </form>
  </section>

  <footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">© 2026 SK MOSARAF | My Portfolio</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
